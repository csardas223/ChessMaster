<!DOCTYPE html>
<!-- Source of assets/og/og-default.png (1200x630 link-preview card). Render: python3 tools/og/render_og.py -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1200px;height:630px;background:#312e2b;font-family:"DejaVu Sans",Arial,sans-serif;overflow:hidden}
.wrap{display:flex;align-items:center;height:630px;padding:0 64px;box-sizing:border-box;gap:56px}
.txt{flex:1;color:#fff}
.logo{width:84px;height:84px;border-radius:14px;display:block;margin-bottom:28px}
h1{font-size:86px;line-height:1;margin:0 0 14px;font-weight:800;letter-spacing:-1px}
.sub{font-size:34px;color:#bababa;margin:0 0 34px}
.pill{display:inline-block;background:#81b64c;box-shadow:inset 0 -6px 0 #45753c;color:#fff;font-weight:800;font-size:32px;padding:16px 30px 20px;border-radius:12px}
.meta{font-size:24px;color:#989795;margin-top:26px}
.board{display:grid;grid-template-columns:repeat(8,58px);grid-template-rows:repeat(8,58px);border-radius:6px;overflow:hidden;box-shadow:0 16px 40px rgba(0,0,0,.45)}
.sq{width:58px;height:58px;display:flex;align-items:center;justify-content:center}
.l{background:#ebecd0}.d{background:#739552}
.sq img{width:54px;height:54px}
</style></head><body><div class="wrap">
<div class="txt"><img class="logo" src="../../assets/img/logo.jpg" alt="">
<h1>Chess Master</h1><p class="sub">iwantcheckmate fan remake</p>
<span class="pill">Play 500+ chess variants</span>
<div class="meta">The modes from the videos, in your browser. Free, no account.</div></div>
<div class="board" id="b"></div></div>
<script>
var fen='r1bqk2r/pppp1ppp/2n2n2/2b1p3/2B1P3/3P1N2/PPP2PPP/RNBQK2R'.split('/'),b=document.getElementById('b');
fen.forEach(function(row,r){var c=0;row.split('').forEach(function(ch){if(/\d/.test(ch)){for(var i=0;i<+ch;i++){add(r,c++,null)}}else add(r,c++,ch)})});
function add(r,c,p){var d=document.createElement('div');d.className='sq '+((r+c)%2?'d':'l');if(p){var i=document.createElement('img');i.src='../../assets/pieces/staunty/'+(p===p.toUpperCase()?'w':'b')+p.toUpperCase()+'.svg';d.appendChild(i)}b.appendChild(d)}
</script></body></html>
