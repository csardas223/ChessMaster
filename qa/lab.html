<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Chess Master QA lab</title>
</head>
<body>
<p id="lab-note" style="font:14px system-ui;padding:12px">Loading the app with fresh assets…</p>
<script>
/* QA harness: the preview proxy caches files by path, so replay index.html with ?v=<timestamp> on every local
   script/stylesheet. The app itself is untouched; use it as /qa/lab.html#/play/<id>. */
(async function () {
  try {
    const t = Date.now();
    const html = await (await fetch('../index.html', { cache: 'no-store' })).text();
    /* app.js loads the engine/controller bundle with <script> tags at runtime: version every script it creates too */
    const patch = '<script>(function(){var v="?v="+Date.now(),make=document.createElement.bind(document);' +
      'document.createElement=function(n,o){var el=make(n,o);if(String(n).toLowerCase()==="script"){try{' +
      'var d=Object.getOwnPropertyDescriptor(HTMLScriptElement.prototype,"src");' +
      'Object.defineProperty(el,"src",{configurable:true,get:function(){return d.get.call(el);},' +
      'set:function(u){d.set.call(el,String(u).indexOf("?")<0?u+v:u);}});}catch(e){}}return el;};})();<\/script>';
    const bust = html.replace(/<head([^>]*)>/i, '<head$1><base href="../">')
      .replace(/<body([^>]*)>/i, function (m, attrs) { return '<body' + attrs + '>' + patch; })
      .replace(/(src|href)="(?!https?:|\/\/|#|data:)([^"?]+\.(?:js|css))"/g, function (m, attr, url) {
        return attr + '="' + url + '?v=' + t + '"';
      });
    document.open(); document.write(bust); document.close();
  } catch (e) {
    document.getElementById('lab-note').textContent = 'QA lab failed: ' + e.message;
  }
})();
</script>
</body>
</html>
