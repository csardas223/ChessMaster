<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <!-- pol-q3 redraw of the chess.com Chaturanga mode icon seen in the video (white elephant head on a green tile);
       the old 320px crop was an upscaled blur with the video's light border baked in. Silhouette traced from
       research/frames/sprites/XfDeP9FjZ7w_chaturanga_elephant.png. -->
  <rect x="20" y="20" width="280" height="280" rx="28" fill="#7fa650"/>
  <g stroke="#1e1e1e" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" fill="#f6f6f1">
    <!-- plinth -->
    <rect x="92" y="232" width="150" height="34" rx="10"/>
    <!-- head + trunk -->
    <path d="M100 216 C 84 170 82 118 112 92 C 146 64 206 62 244 80 C 230 120 232 156 236 176
             C 224 168 208 168 200 178 C 192 188 176 190 164 182 C 152 174 140 176 136 188
             C 132 200 136 210 144 216 Z"/>
    <!-- ear flap -->
    <path d="M178 104 C 204 100 222 116 220 146" fill="none"/>
    <!-- trunk curl -->
    <path d="M136 188 C 118 186 108 168 118 154 C 126 144 140 150 138 160" fill="none"/>
    <!-- tusk -->
    <path d="M150 170 C 168 158 196 154 214 160 C 196 168 176 174 158 178 Z" fill="#ffffff"/>
  </g>
  <circle cx="132" cy="118" r="9" fill="#1e1e1e"/>
</svg>
