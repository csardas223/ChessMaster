name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install tooling
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (rules)
        run: npm test

      - name: Validate mode data
        run: npm run validate

      - name: Engine sweep (all 500 modes)
        run: npm run sweep
