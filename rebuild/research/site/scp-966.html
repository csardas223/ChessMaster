 // During the engine turn, White pieces remain tactile: pick one up immediately,

 if(wasDrag&&end){const m=legalMoves(HUMAN).find(x=>same(x.a,start)&&same(x.b,end));if(m){commit(m,m.promo?null:'Q',false);return}}

}
function beginRight(s){if(!s)return;pointerMode='right';pointerStart=s;drawPreview(s,s)}
function endRight(e){if(pointerMode!=='right')return;const end=sqFromEvent(e),start=pointerStart;pointerMode=null;pointerStart=null;removePreview();if(!start||!end)return;if(same(start,end)){toggleSquareHighlight(start);return}toggleArrow(start,end)}
function removePreview(){if(rightPreview){rightPreview.remove();rightPreview=null}}
function drawPreview(a,b){removePreview();if(same(a,b))return;rightPreview=arrowGroup(a,b,.55);arrows.appendChild(rightPreview)}
function updateRight(e){if(pointerMode==='right'&&pointerStart){const s=sqFromEvent(e);if(s)drawPreview(pointerStart,s)}}
function arrowGroup(a,b,opacity=1){
 const ns='http://www.w3.org/2000/svg',g=document.createElementNS(ns,'g');g.dataset.kind='arrow';g.dataset.key=`${a.f},${a.r}-${b.f},${b.r}`;g.setAttribute('opacity',opacity);
 const aa=dsp(a),bb=dsp(b),x1=(aa.f+.5)*100,y1=(aa.r+.5)*100,x2=(bb.f+.5)*100,y2=(bb.r+.5)*100,dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,headLen=34,half=18,baseX=x2-ux*headLen,baseY=y2-uy*headLen,px=-uy,py=ux;
 const line=document.createElementNS(ns,'line');line.setAttribute('x1',x1);line.setAttribute('y1',y1);line.setAttribute('x2',baseX);line.setAttribute('y2',baseY);line.setAttribute('stroke','#CC00FF');line.setAttribute('stroke-width','11');line.setAttribute('stroke-linecap','round');

}
function toggleArrow(a,b){const key=`${a.f},${a.r}-${b.f},${b.r}`,old=arrows.querySelector(`[data-kind="arrow"][data-key="${key}"]`);if(old)old.remove();else arrows.appendChild(arrowGroup(a,b,1))}
board.addEventListener('pointerdown',e=>{lastPointerClient={clientX:e.clientX,clientY:e.clientY};if(e.button===2){e.preventDefault();const s=sqFromEvent(e);beginRight(s);board.setPointerCapture?.(e.pointerId)}else if(e.button===0){e.preventDefault();clearAnnotations();const s=sqFromEvent(e);beginLeft(s,e);board.setPointerCapture?.(e.pointerId)}updateBoardCursor(e)});
board.addEventListener('pointermove',e=>{updateDrag(e);updateRight(e);updateBoardCursor(e)});

function fen(){let rows=[];for(let r=0;r<8;r++){let s='',n=0;for(let f=0;f<8;f++){const p=B[r][f];if(!p)n++;else{if(n){s+=n;n=0}const ch=p[1],v=ch==='P'?'p':ch.toLowerCase();s+=(zombieAt(f,r)?'w':p[0])==='w'?v.toUpperCase():v}}if(n)s+=n;rows.push(s)}let cst='';if(castle.wK)cst+='K';if(castle.wQ)cst+='Q';if(castle.bK)cst+='k';if(castle.bQ)cst+='q';const eps=ep?String.fromCharCode(97+ep.f)+(8-ep.r):'-';return `${rows.join('/')} ${turn} ${cst||'-'} ${eps} ${halfmove} ${fullmove}`}
let engineReady=false,waiting=false;
let engineResponseNotBefore=0,engineSearchActive=false,engineBestUci=null;
let engineBootPromise=null,engineLastError='';
let fairyScriptPromise=null;
function loadFairyStockfishScript(){
 if(window.Stockfish)return Promise.resolve();
 if(fairyScriptPromise)return fairyScriptPromise;
 fairyScriptPromise=new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='/fairy-stockfish/stockfish.js';s.async=true;s.onload=resolve;s.onerror=()=>reject(new Error('Could not load Fairy-Stockfish.'));document.head.appendChild(s)});

}
function waitForFairyLine(engine,predicate,timeoutMs=10000){return new Promise((resolve,reject)=>{const timeout=setTimeout(()=>{engine.removeMessageListener(listener);reject(new Error('Fairy-Stockfish timed out.'))},timeoutMs);const listener=line=>{if(!predicate(String(line)))return;clearTimeout(timeout);engine.removeMessageListener(listener);resolve(String(line))};engine.addMessageListener(listener)})}
class SCP966FairyEngine{
 constructor(){this.engine=null;this.initPromise=null}
 async init(){
  if(this.engine)return;if(this.initPromise)return this.initPromise;
  this.initPromise=(async()=>{
   if(!window.crossOriginIsolated||typeof SharedArrayBuffer==='undefined')throw new Error('SCP page is not cross-origin isolated.');
   await loadFairyStockfishScript();if(!window.Stockfish)throw new Error('Fairy-Stockfish factory was not found.');
   const e=await window.Stockfish({locateFile:path=>`/fairy-stockfish/${path}`});
   this.engine=e;
   const uciok=waitForFairyLine(e,line=>line.trim()==='uciok');e.postMessage('uci');await uciok;
   e.postMessage('setoption name UCI_Variant value chess');
   e.postMessage('setoption name UCI_LimitStrength value false');
   e.postMessage('setoption name Skill Level value 20');
   e.postMessage('setoption name Threads value 1');e.postMessage('setoption name Hash value 128');e.postMessage('setoption name MultiPV value 1');
   const ready=waitForFairyLine(e,line=>line.trim()==='readyok');e.postMessage('isready');await ready;engineReady=true;
  })();
  try{await this.initPromise}catch(err){this.initPromise=null;this.engine=null;throw err}
 }
 async newGame(){await this.init();const e=this.engine;e.postMessage('ucinewgame');const ready=waitForFairyLine(e,line=>line.trim()==='readyok');e.postMessage('isready');await ready}
 async bestMove(positionFen,moveTimeMs=ENGINE_SEARCH_MS, searchmoves=[]){
  await this.init();const e=this.engine;
  const result=waitForFairyLine(e,line=>line.startsWith('bestmove '),moveTimeMs+10000);

  e.postMessage(`position fen ${positionFen}`);e.postMessage(`go movetime ${moveTimeMs}${searchmoves.length ? " searchmoves " + searchmoves.join(" ") : ""}`);
  const line=await result,u=line.trim().split(/\s+/)[1];return(!u||u==='(none)'||u==='0000')?null:u;
 }
}

const stockfishEngine=new SCP966FairyEngine();
const ENGINE_DELAY_MS=0,ENGINE_SEARCH_MS=1000;



function moveToUci(m,prom='q'){
  const sq=s=>String.fromCharCode(97+s.f)+(8-s.r);
  return sq(m.a)+sq(m.b)+(m.promo?prom:'');
}
function engineSearchMoves(moves){
  return moves.flatMap(m=>m.promo?['q','r','b','n'].map(p=>moveToUci(m,p)):[moveToUci(m)]);
}
function engineFail(err){
  engineReady=false;
  engineLastError=String(err&&err.message?err.message:err);
  console.error('Fairy Stockfish initialization failure:',err);
  setStatus('Fairy Stockfish failed to initialize. '+engineLastError);
}
async function bootEngine(){
  if(engineBootPromise)return engineBootPromise;
  engineBootPromise=(async()=>{
    try{
      await stockfishEngine.newGame();
      engineReady=true;
      if(!ended&&turn===ENGINE&&!waiting&&!engineSearchActive)engineMove();
      else if(!ended&&turn===HUMAN)setStatus('Your move.');
      return true;
    }catch(e){engineFail(e);throw e}
  })();
  return engineBootPromise;
}
function scheduleEngineMove(){
  engineResponseNotBefore=performance.now()+ENGINE_DELAY_MS;
  engineBestUci=null;
  engineMove();
}
async function engineMove(){
  if(ended||turn!==ENGINE||animating||waiting||engineSearchActive)return;
  const moves=legalMoves(ENGINE).filter(x=>!zombieAt(x.a.f,x.a.r));if(!moves.length)return;
  if(!engineReady){
    setStatus('Fairy Stockfish is loading…');
    try{await bootEngine()}catch(_){return}
    if(ended||turn!==ENGINE)return;
  }
  waiting=true;engineSearchActive=true;engineBestUci=null;
  setStatus('Fairy Stockfish is thinking…');
  try{
    engineBestUci=await stockfishEngine.bestMove(fen(),ENGINE_SEARCH_MS,engineSearchMoves(moves));
    waiting=false;engineSearchActive=false;
    chooseEngineResult();
  }catch(e){
    waiting=false;engineSearchActive=false;
    engineFail(e);
  }
}
function chooseEngineResult(){
  const legal=legalMoves(ENGINE).filter(x=>!zombieAt(x.a.f,x.a.r));
  const m=findUciMove(engineBestUci,legal);
  if(m)return runAtResponseTime(()=>commit(m,promotionFromUci(engineBestUci)));
  console.error('Fairy Stockfish returned a move not accepted by UI:',engineBestUci,'FEN:',fen());
  if(legal.length)return runAtResponseTime(()=>commit(legal[Math.floor(Math.random()*legal.length)],'Q'));setStatus('No legal moves.');
}
function findUciMove(u,moves=legalMoves(ENGINE)){
  if(!u||u==='(none)'||u.length<4)return null;
  const a={f:u.charCodeAt(0)-97,r:8-Number(u[1])},b={f:u.charCodeAt(2)-97,r:8-Number(u[3])};
  return moves.find(x=>same(x.a,a)&&same(x.b,b)&&!zombieAt(x.a.f,x.a.r))||null;
}
function promotionFromUci(u){return u&&u[4]?u[4].toUpperCase():'Q'}
function runAtResponseTime(fn){
  const wait=Math.max(0,engineResponseNotBefore-performance.now());
  setTimeout(()=>{if(!ended&&turn===ENGINE&&!animating)fn()},wait);
}

function updateResponsiveBoardSize() {
  const boardWrap = document.querySelector('.board-wrap');
  const boardColumn = document.querySelector('.game-board-column');
  const gameShell = document.querySelector('.game-shell');
  const returnHome = document.querySelector('.return-home');

  if (!boardWrap || !boardColumn || !gameShell) return;

  const viewportWidth = window.innerWidth;
  const viewportHeight = window.innerHeight;

  // The board is intentionally sized to 90% of the space it could safely use.
  // This leaves breathing room while preventing users from needing browser zoom.
  const mobileLayout = viewportWidth <= 960;

  const horizontalPagePadding = viewportWidth <= 640 ? 24 : 40;
  const sidebarAndGap = mobileLayout ? 0 : 346; // 320px minimum info panel + 26px gap

  const availableWidth = Math.max(
    280,
    viewportWidth - horizontalPagePadding - sidebarAndGap,
  );

  const boardTop = boardWrap.getBoundingClientRect().top;

  // Reserve room beneath the board for the resign controls and a little spacing.
  const controlsReserve = 64;
  const availableHeight = Math.max(
    280,
    viewportHeight - boardTop - controlsReserve,
  );

  const boardSize = Math.max(
    280,
    Math.floor(Math.min(availableWidth, availableHeight) * 0.9),
  );

  const squareSize = boardSize / 8;
  const botTextSize = squareSize / 6;

  boardWrap.style.width = `${boardSize}px`;
  boardColumn.style.width = `${boardSize}px`;

  gameShell.style.setProperty('--board-square-size', `${squareSize}px`);
  gameShell.style.setProperty('--bot-text-size', `${botTextSize}px`);

  if (returnHome) {
    const shellRect = gameShell.getBoundingClientRect();
    const boardRect = boardWrap.getBoundingClientRect();
    const boardOffset = Math.max(0, boardRect.left - shellRect.left);
    returnHome.style.marginLeft = `${boardOffset}px`;
  }

}
function refreshSCP966BoardSize(){

 requestAnimationFrame(updateResponsiveBoardSize);
}
window.addEventListener('resize',refreshSCP966BoardSize);
