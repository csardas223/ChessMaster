const A='';

const board=document.getElementById('board'),cells=document.getElementById('cells'),squareAnnotations=document.getElementById('squareAnnotations'),piecesEl=document.getElementById('pieces'),moveLayer=document.getElementById('moveLayer'),confettiLayer=document.getElementById('confettiLayer'),arrows=document.getElementById('arrows'),promo=document.getElementById('promo'),promoBox=document.getElementById('promoBox'),moveSound=document.getElementById('moveSound'),captureSound=document.getElementById('captureSound');
for(let r=0;r<8;r++)for(let f=0;f<8;f++){const d=document.createElement('div');d.className='cell';d.dataset.sq=`${f},${r}`;cells.appendChild(d)}

let repetition=new Map();
let pointerMode=null,pointerStart=null,pointerStartXY=null,dragGhost=null,rightPreview=null;
let lastPointerClient=null;
const ANIM_MS=300;
const HUMAN='w', ENGINE='b';
function df(f){return f} function dr(r){return r} function dsp(s){return {f:df(s.f),r:dr(s.r)}}
function inb(f,r){return f>=0&&f<8&&r>=0&&r<8}
function cloneBoard(b){return b.map(row=>row.slice())}
function opp(c){return c==='w'?'b':'w'}
function same(a,b){return !!a&&!!b&&a.f===b.f&&a.r===b.r}

function init(){
 B=Array.from({length:8},()=>Array(8).fill(null));
 const whiteBack=['R','N','B','Q','K','B','N','R'];
 const blackBack=['R','N','B','Q','K','B','N','R'];
 for(let f=0;f<8;f++){B[7][f]='w'+whiteBack[f];B[6][f]='wP';B[0][f]='b'+blackBack[f];B[1][f]='bP'}
 turn='w';selected=null;lastMove=null;ep=null;castle={wK:1,wQ:1,bK:1,bQ:1};halfmove=0;fullmove=1;ended=false;pendingPromo=null;animating=false;endEffect=null;repetition=new Map();
  deerSquare={f:2,r:4};B[4][2]=DEER;turnsUntilShuffle=nextInterval();
  waiting=false;engineSearchActive=false;
 clearAnnotations();promo.classList.remove('show');moveLayer.innerHTML='';confettiLayer.innerHTML='';
 addRepetition();render();setStatus('Your move.');
}
function cell(s){const q=dsp(s);return cells.querySelector(`[data-sq="${q.f},${q.r}"]`)}
function squarePos(s){const q=dsp(s);return {left:q.f*12.5,top:q.r*12.5}}
function render(hiddenSquares=[]){
 document.querySelectorAll('.cell').forEach(x=>x.className='cell');
 if(lastMove){cell(lastMove.a)?.classList.add('last');cell(lastMove.b)?.classList.add('last')}
 if(selected&&!ended&&turn===HUMAN){
   cell(selected)?.classList.add('selected');
   for(const m of legalMoves(HUMAN).filter(m=>same(m.a,selected))){
     const isCap=!!B[m.b.r][m.b.f]||m.ep;
     cell(m.b)?.classList.add(isCap?'capture':'legal');
   }
 }
 for(const c of ['w','b']){const k=findKing(c);if(k&&attacked(k.f,k.r,opp(c),B))cell(k)?.classList.add('check')}
 if(endEffect?.type==='draw')for(const k of endEffect.kings)cell(k)?.classList.add('drawKingSquare');
 piecesEl.innerHTML='';
 for(let r=0;r<8;r++)for(let f=0;f<8;f++)if(B[r][f])addPiece(B[r][f],f,r,hiddenSquares.some(s=>s.f===f&&s.r===r));
}
function addPiece(p,f,r,hidden=false){const i=document.createElement('img');let extra='';if(endEffect?.type==='draw'&&p[1]==='K')extra+=' drawKing';if(endEffect?.type==='mate'&&endEffect.loser===p[0]&&p[1]==='K')extra+=' checkmatedKing';i.className='piece'+(hidden?' hiddenForMove':'')+extra;i.src=A+imgs[p];i.alt='';i.dataset.square=`${f},${r}`;const q=dsp({f,r});i.style.left=(q.f*12.5)+'%';i.style.top=(q.r*12.5)+'%';piecesEl.appendChild(i)}
function pseudo(c,b=B){
 const out=[];const push=(f,r,nf,nr,extra={})=>{if(!inb(nf,nr))return;const t=b[nr][nf];if(!t||(t!==DEER&&t[0]!==c&&t[1]!=='K'))out.push({a:{f,r},b:{f:nf,r:nr},...extra})};
 const knightSteps=[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]];
 const slide=(f,r,dirs)=>{for(const [df,dr] of dirs){let nf=f+df,nr=r+dr;while(inb(nf,nr)){const q=b[nr][nf];if(!q)push(f,r,nf,nr);else{if(q[0]!==c)push(f,r,nf,nr);break}nf+=df;nr+=dr}}};
 for(let r=0;r<8;r++)for(let f=0;f<8;f++){
   const p=b[r][f];if(!p||p[0]!==c)continue;const t=p[1];
   if(t==='P'){
     const d=c==='w'?-1:1,start=c==='w'?6:1,prom=c==='w'?0:7;
     if(inb(f,r+d)&&!b[r+d][f]){push(f,r,f,r+d,{promo:r+d===prom});if(r===start&&!b[r+2*d][f])push(f,r,f,r+2*d,{dbl:1})}
     for(const df of[-1,1]){const nf=f+df,nr=r+d;if(inb(nf,nr)){const q=b[nr][nf];if(q&&q[0]!==c)push(f,r,nf,nr,{promo:nr===prom})}if(ep&&ep.f===nf&&ep.r===nr)push(f,r,nf,nr,{ep:1})}
   } else if(t==='N'){
     for(const [df,dr] of knightSteps)push(f,r,f+df,r+dr)
   } else if(t==='B'||t==='R'||t==='Q'){
     const ds=[];if(t!=='R')ds.push([1,1],[-1,1],[1,-1],[-1,-1]);if(t!=='B')ds.push([1,0],[-1,0],[0,1],[0,-1]);slide(f,r,ds);
   } else if(t==='K'){
     for(let df=-1;df<=1;df++)for(let dr=-1;dr<=1;dr++)if(df||dr)push(f,r,f+df,r+dr);
     const rr=c==='w'?7:0;
     if(r===rr&&f===4&&!attacked(4,rr,opp(c),b)){
       if(castle[c+'K']&&!b[rr][5]&&!b[rr][6]&&b[rr][7]===c+'R'&&!attacked(5,rr,opp(c),b)&&!attacked(6,rr,opp(c),b))push(f,r,6,rr,{castle:'K'});
       if(castle[c+'Q']&&!b[rr][1]&&!b[rr][2]&&!b[rr][3]&&b[rr][0]===c+'R'&&!attacked(3,rr,opp(c),b)&&!attacked(2,rr,opp(c),b))push(f,r,2,rr,{castle:'Q'});
     }
   }
 }

}
function attacked(f,r,by,b=B){
 const knightSteps=[[1,2],[2,1]];
 const lineClear=(ff,rr,df,dr)=>{const sf=Math.sign(df),sr=Math.sign(dr);let x=ff+sf,y=rr+sr;while(x!==f||y!==r){if(b[y][x])return false;x+=sf;y+=sr}return true};
 for(let rr=0;rr<8;rr++)for(let ff=0;ff<8;ff++){
   const p=b[rr][ff];if(!p||p[0]!==by)continue;const t=p[1],df=f-ff,dr=r-rr;
   if(t==='P'&&dr===(by==='w'?-1:1)&&Math.abs(df)===1)return true;
   if(t==='N'&&knightSteps.some(x=>Math.abs(df)===x[0]&&Math.abs(dr)===x[1]))return true;
   if(t==='K'&&Math.max(Math.abs(df),Math.abs(dr))===1)return true;
   if(['B','R','Q'].includes(t)){
     const diag=(Math.abs(df)===Math.abs(dr)&&df!==0),orth=((df===0&&dr!==0)||(dr===0&&df!==0));
     const ok=(diag&&['B','Q'].includes(t))||(orth&&['R','Q'].includes(t));
     if(ok&&lineClear(ff,rr,df,dr))return true;
   }

}
function findKing(c,b=B){for(let r=0;r<8;r++)for(let f=0;f<8;f++)if(b[r][f]===c+'K')return{f,r};return null}
function legalMoves(c){const arr=[];for(const m of pseudo(c)){const nb=cloneBoard(B);applyBoard(nb,m,c,'Q');const k=findKing(c,nb);if(k&&!attacked(k.f,k.r,opp(c),nb))arr.push(m)}return arr}
function applyBoard(b,m,c,prom='Q'){

}
function choosePromo(m,animateMove=true){
 pendingPromo={m,animateMove};
 selected=null;
 render();
 promoBox.innerHTML='';
 const qpos=dsp(m.b);
 promoBox.style.left=(qpos.f*12.5)+'%';
 promoBox.style.top=(qpos.r*12.5)+'%';
 for(const q of ['Q','R','B','N']){
   const i=document.createElement('img');i.src=A+imgs[HUMAN+q];i.alt=q;i.title=q;
   i.onpointerdown=e=>e.stopPropagation();
   i.onclick=e=>{e.stopPropagation();promo.classList.remove('show');const pp=pendingPromo;pendingPromo=null;if(pp)commit(pp.m,q,pp.animateMove)};
   promoBox.appendChild(i)

}
function cancelPromotion(){
 if(!pendingPromo)return;

 render();

function setStatus(s){}
function sqFromEvent(e){const rc=board.getBoundingClientRect(),x=e.clientX-rc.left,y=e.clientY-rc.top;if(x<0||y<0||x>=rc.width||y>=rc.height)return null;return{f:Math.floor(x/rc.width*8),r:Math.floor(y/rc.height*8)}}

class DeerFairyEngine{

   await loadFairyStockfishScript();if(!window.Stockfish)throw new Error('Fairy-Stockfish factory was not found.');

   const uciok=waitForFairyLine(e,line=>line.trim()==='uciok');e.postMessage('uci');await uciok;
   e.postMessage('setoption name UCI_Variant value chess');

const stockfishEngine=new DeerFairyEngine();
const ENGINE_DELAY_MS=0,ENGINE_SEARCH_MS=1000;





function moveToUci(m,prom='q'){
  const sq=s=>String.fromCharCode(97+s.f)+(8-s.r);
  return sq(m.a)+sq(m.b)+(m.promo?prom:'');
}
function engineSearchMoves(moves){
  return moves.flatMap(m=>m.promo?['q','r','b','n'].map(p=>moveToUci(m,p)):[moveToUci(m)]);
}
function engineFail(err){
  engineReady=false;
  engineLastError=String(err&&err.message?err.message:err);
  console.error('Fairy Stockfish initialization failure:',err);

}
async function bootEngine(){
  if(engineBootPromise)return engineBootPromise;
  engineBootPromise=(async()=>{
    try{
      await stockfishEngine.newGame();
      engineReady=true;
      if(!ended&&turn===ENGINE&&!waiting&&!engineSearchActive)engineMove();
      else if(!ended&&turn===HUMAN)setStatus('Your move.');
      return true;
    }catch(e){engineFail(e);throw e}
  })();
  return engineBootPromise;
}
function scheduleEngineMove(){
  engineResponseNotBefore=performance.now()+ENGINE_DELAY_MS;
  engineBestUci=null;
  engineMove();
}
async function engineMove(){
  if(ended||turn!==ENGINE||animating||waiting||engineSearchActive)return;
  const moves=legalMoves(ENGINE);if(!moves.length)return;
  if(!engineReady){
    setStatus('Fairy Stockfish is loading…');
    try{await bootEngine()}catch(_){return}
    if(ended||turn!==ENGINE||waiting||engineSearchActive)return;
  }
  waiting=true;engineSearchActive=true;engineBestUci=null;
  setStatus('Fairy Stockfish is thinking…');
  try{
    engineBestUci=await stockfishEngine.bestMove(fen(),ENGINE_SEARCH_MS,engineSearchMoves(moves));
    waiting=false;engineSearchActive=false;
    chooseEngineResult();
  }catch(e){
    waiting=false;engineSearchActive=false;
    engineFail(e);
  }
}
function chooseEngineResult(){
  const legal=legalMoves(ENGINE);
  const m=findUciMove(engineBestUci,legal);
  if(m)return runAtResponseTime(()=>commit(m,promotionFromUci(engineBestUci)));
  console.error('Fairy Stockfish returned a move not accepted by UI:',engineBestUci,'FEN:',fen());
  document.getElementById('engineError').textContent='Stockfish returned an invalid move. Refresh the page to retry.';
}
function findUciMove(u,moves=legalMoves(ENGINE)){
  if(!u||u==='(none)'||u.length<4)return null;
  const a={f:u.charCodeAt(0)-97,r:8-Number(u[1])},b={f:u.charCodeAt(2)-97,r:8-Number(u[3])};
  return moves.find(x=>same(x.a,a)&&same(x.b,b))||null;
}
function promotionFromUci(u){return u&&u[4]?u[4].toUpperCase():'Q'}
function runAtResponseTime(fn){
  const wait=Math.max(0,engineResponseNotBefore-performance.now());
  setTimeout(()=>{if(!ended&&turn===ENGINE&&!animating)fn()},wait);
}

function updateResponsiveBoardSize() {
  const boardWrap = document.querySelector('.board-wrap');
  const boardColumn = document.querySelector('.game-board-column');
  const gameShell = document.querySelector('.game-shell');
  const returnHome = document.querySelector('.return-home');

  if (!boardWrap || !boardColumn || !gameShell) return;

  const viewportWidth = window.innerWidth;
  const viewportHeight = window.innerHeight;

  // The board is intentionally sized to 90% of the space it could safely use.
  // This leaves breathing room while preventing users from needing browser zoom.
  const mobileLayout = viewportWidth <= 960;

  const horizontalPagePadding = viewportWidth <= 640 ? 24 : 40;
  const sidebarAndGap = mobileLayout ? 0 : 346; // 320px minimum info panel + 26px gap

  const availableWidth = Math.max(
    280,
    viewportWidth - horizontalPagePadding - sidebarAndGap,
  );

  const boardTop = boardWrap.getBoundingClientRect().top;

  // Reserve room beneath the board for the resign controls and a little spacing.
  const controlsReserve = 64;
  const availableHeight = Math.max(
    280,
    viewportHeight - boardTop - controlsReserve,
  );

  const boardSize = Math.max(
    280,
    Math.floor(Math.min(availableWidth, availableHeight) * 0.9),
  );

  const squareSize = boardSize / 8;
  const botTextSize = squareSize / 6;

  boardWrap.style.width = `${boardSize}px`;
  boardColumn.style.width = `${boardSize}px`;

  gameShell.style.setProperty('--board-square-size', `${squareSize}px`);
  gameShell.style.setProperty('--bot-text-size', `${botTextSize}px`);

  if (returnHome) {
    const shellRect = gameShell.getBoundingClientRect();
    const boardRect = boardWrap.getBoundingClientRect();
    const boardOffset = Math.max(0, boardRect.left - shellRect.left);
    returnHome.style.marginLeft = `${boardOffset}px`;
  }

}
function refreshDeerBoardSize(){
 updateResponsiveBoardSize();

}
window.addEventListener('resize',refreshDeerBoardSize);
window.addEventListener('load',refreshDeerBoardSize,{once:true});
init();refreshDeerBoardSize();bootEngine().catch(error=>setStatus('Engine unavailable: '+error.message));
