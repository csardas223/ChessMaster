<script>
console.info("Trojan Horse Chess — based on cleaned base v5");
'use strict';
/*
BASE TEMPLATE CONTRACT — preserve these unless a requested variant explicitly changes them:
- Human plays White; Fairy Stockfish plays Black.
- Click-to-move and drag-and-drop.
- Selected square, legal dots, capture rings, last-move and 50% red check highlights.
- Right-drag #CC00FF arrows above pieces; right-click #CC00FF square highlights at 50% opacity.
- Left-click and every move clear annotations.
- Smooth 300 ms movement/capture/castling animations for click-to-move and engine moves.
- Human drag-and-drop moves snap directly to the destination center with no post-drop animation.
- While Fairy Stockfish is thinking, White pieces remain draggable for tactile interaction; releasing always snaps them back without changing the position. Arrows/highlights remain usable and are cleared when the engine moves.
- Board-anchored Q/R/B/N promotion dropdown: 1 square wide × 4 squares tall, white, slightly rounded.
- Board-centered result popup with no buttons. Messages: You Won! :), Draw! :0, You Lost! :( in regular Arial.
- move-sound.mp3 and capture.mp3 are the standard audio hooks.
- Fairy Stockfish runs in-browser using the website's bundled engine assets.
- 1500 ms minimum reply delay; 5000 ms full engine search; Skill 20 / unrestricted / MultiPV 1.
*/
const A='';
const imgs={wK:'/pieces/wK.svg',wQ:'/pieces/wQ.svg',wR:'/pieces/wR.svg',wB:'/pieces/wB.svg',wN:'/challenges/trojan-horse/wooden-knight-v2.png',wP:'/pieces/wP.svg',bK:'/pieces/bK.svg',bQ:'/pieces/bQ.svg',bR:'/pieces/bR.svg',bB:'/pieces/bB.svg',bN:'/pieces/bN.svg',bP:'/pieces/bP.svg'};
const board=document.getElementById('board'),cells=document.getElementById('cells'),squareAnnotations=document.getElementById('squareAnnotations'),piecesEl=document.getElementById('pieces'),moveLayer=document.getElementById('moveLayer'),arrows=document.getElementById('arrows'),popup=document.getElementById('popup'),resultEl=document.getElementById('result'),promo=document.getElementById('promo'),promoBox=document.getElementById('promoBox'),moveSound=document.getElementById('moveSound'),captureSound=document.getElementById('captureSound');
for(let r=0;r<8;r++)for(let f=0;f<8;f++){const d=document.createElement('div');d.className='cell';d.dataset.sq=`${f},${r}`;cells.appendChild(d)}
let B,turn,selected,lastMove,ep,castle,halfmove,fullmove,ended,pendingPromo=null,animating=false;
let repetition=new Map();
let pointerMode=null,pointerStart=null,pointerStartXY=null,dragGhost=null,rightPreview=null;
let lastPointerClient=null;
let trojanClickSquare=null,trojanClickCount=0,trojanLastClickAt=0;
const TROJAN_CLICK_GAP_MS=800;
const ANIM_MS=300;
const HUMAN='w', ENGINE='b';
function df(f){return f} function dr(r){return r} function dsp(s){return {f:df(s.f),r:dr(s.r)}}
function inb(f,r){return f>=0&&f<8&&r>=0&&r<8}
function cloneBoard(b){return b.map(row=>row.slice())}
function opp(c){return c==='w'?'b':'w'}
function same(a,b){return !!a&&!!b&&a.f===b.f&&a.r===b.r}

function init(){
 B=Array.from({length:8},()=>Array(8).fill(null));
 const whiteBack=['R','N','B','Q','K','B','N','R'];
 const blackBack=['R','N','B','Q','K','B','N','R'];
 for(let f=0;f<8;f++){B[7][f]='w'+whiteBack[f];B[6][f]='wP';B[0][f]='b'+blackBack[f];B[1][f]='bP'}
 turn='w';selected=null;lastMove=null;ep=null;castle={wK:1,wQ:1,bK:1,bQ:1};halfmove=0;fullmove=1;ended=false;pendingPromo=null;animating=false;repetition=new Map();
  waiting=false;engineSearchActive=false;
 clearAnnotations();popup.classList.remove('show');promo.classList.remove('show');moveLayer.innerHTML='';
 addRepetition();render();setStatus('Your move.');
 if(typeof stockfishEngine!=='undefined')stockfishEngine.newGame().catch(e=>console.warn('Fairy Stockfish reset failed:',e));
}
function cell(s){const q=dsp(s);return cells.querySelector(`[data-sq="${q.f},${q.r}"]`)}
function squarePos(s){const q=dsp(s);return {left:q.f*12.5,top:q.r*12.5}}
function render(hiddenSquares=[]){
 document.querySelectorAll('.cell').forEach(x=>x.className='cell');
 if(lastMove){cell(lastMove.a)?.classList.add('last');cell(lastMove.b)?.classList.add('last')}
 if(selected&&!ended&&turn===HUMAN){
   cell(selected)?.classList.add('selected');
   for(const m of legalMoves(HUMAN).filter(m=>same(m.a,selected))){
     const isCap=!!B[m.b.r][m.b.f]||m.ep;
     cell(m.b)?.classList.add(isCap?'capture':'legal');
   }
 }
 for(const c of ['w','b']){const k=findKing(c);if(k&&attacked(k.f,k.r,opp(c),B))cell(k)?.classList.add('check')}
 piecesEl.innerHTML='';
 for(let r=0;r<8;r++)for(let f=0;f<8;f++)if(B[r][f])addPiece(B[r][f],f,r,hiddenSquares.some(s=>s.f===f&&s.r===r));
}
function addPiece(p,f,r,hidden=false){const i=document.createElement('img');i.className='piece'+(p==='wN'?' trojanKnight':'')+(hidden?' hiddenForMove':'');i.src=A+imgs[p];i.alt='';i.dataset.square=`${f},${r}`;const q=dsp({f,r});i.style.left=(q.f*12.5)+'%';i.style.top=(q.r*12.5)+'%';piecesEl.appendChild(i)}
function pseudo(c,b=B){
 const out=[];const push=(f,r,nf,nr,extra={})=>{if(!inb(nf,nr))return;const t=b[nr][nf];if(!t||t[0]!==c)out.push({a:{f,r},b:{f:nf,r:nr},...extra})};
 const knightSteps=[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]];
 const slide=(f,r,dirs)=>{for(const [df,dr] of dirs){let nf=f+df,nr=r+dr;while(inb(nf,nr)){const q=b[nr][nf];if(!q)push(f,r,nf,nr);else{if(q[0]!==c)push(f,r,nf,nr);break}nf+=df;nr+=dr}}};
 for(let r=0;r<8;r++)for(let f=0;f<8;f++){
   const p=b[r][f];if(!p||p[0]!==c)continue;const t=p[1];
   if(t==='P'){
     const d=c==='w'?-1:1,start=c==='w'?6:1,prom=c==='w'?0:7;
     if(inb(f,r+d)&&!b[r+d][f]){push(f,r,f,r+d,{promo:r+d===prom});if(r===start&&!b[r+2*d][f])push(f,r,f,r+2*d,{dbl:1})}
     for(const df of[-1,1]){const nf=f+df,nr=r+d;if(inb(nf,nr)){const q=b[nr][nf];if(q&&q[0]!==c)push(f,r,nf,nr,{promo:nr===prom})}if(ep&&ep.f===nf&&ep.r===nr)push(f,r,nf,nr,{ep:1})}
   } else if(t==='N'){
     for(const [df,dr] of knightSteps)push(f,r,f+df,r+dr)
   } else if(t==='B'||t==='R'||t==='Q'){
     const ds=[];if(t!=='R')ds.push([1,1],[-1,1],[1,-1],[-1,-1]);if(t!=='B')ds.push([1,0],[-1,0],[0,1],[0,-1]);slide(f,r,ds);
   } else if(t==='K'){
     for(let df=-1;df<=1;df++)for(let dr=-1;dr<=1;dr++)if(df||dr)push(f,r,f+df,r+dr);
     const rr=c==='w'?7:0;
     if(r===rr&&f===4&&!attacked(4,rr,opp(c),b)){
       if(castle[c+'K']&&!b[rr][5]&&!b[rr][6]&&b[rr][7]===c+'R'&&!attacked(5,rr,opp(c),b)&&!attacked(6,rr,opp(c),b))push(f,r,6,rr,{castle:'K'});
       if(castle[c+'Q']&&!b[rr][1]&&!b[rr][2]&&!b[rr][3]&&b[rr][0]===c+'R'&&!attacked(3,rr,opp(c),b)&&!attacked(2,rr,opp(c),b))push(f,r,2,rr,{castle:'Q'});
     }
   }
 }
 return out;
}
function attacked(f,r,by,b=B){
 const knightSteps=[[1,2],[2,1]];
 const lineClear=(ff,rr,df,dr)=>{const sf=Math.sign(df),sr=Math.sign(dr);let x=ff+sf,y=rr+sr;while(x!==f||y!==r){if(b[y][x])return false;x+=sf;y+=sr}return true};
 for(let rr=0;rr<8;rr++)for(let ff=0;ff<8;ff++){
   const p=b[rr][ff];if(!p||p[0]!==by)continue;const t=p[1],df=f-ff,dr=r-rr;
   if(t==='P'&&dr===(by==='w'?-1:1)&&Math.abs(df)===1)return true;
   if(t==='N'&&knightSteps.some(x=>Math.abs(df)===x[0]&&Math.abs(dr)===x[1]))return true;
   if(t==='K'&&Math.max(Math.abs(df),Math.abs(dr))===1)return true;
   if(['B','R','Q'].includes(t)){
     const diag=(Math.abs(df)===Math.abs(dr)&&df!==0),orth=((df===0&&dr!==0)||(dr===0&&df!==0));
     const ok=(diag&&['B','Q'].includes(t))||(orth&&['R','Q'].includes(t));
     if(ok&&lineClear(ff,rr,df,dr))return true;
   }
 }
 return false;
}
function findKing(c,b=B){for(let r=0;r<8;r++)for(let f=0;f<8;f++)if(b[r][f]===c+'K')return{f,r};return null}
function legalMoves(c){const arr=[];for(const m of pseudo(c)){const nb=cloneBoard(B);applyBoard(nb,m,c,'Q');const k=findKing(c,nb);if(k&&!attacked(k.f,k.r,opp(c),nb))arr.push(m)}return arr}
function applyBoard(b,m,c,prom='Q'){
 const p=b[m.a.r][m.a.f],captured=m.ep?b[m.a.r][m.b.f]:b[m.b.r][m.b.f];b[m.a.r][m.a.f]=null;if(m.ep)b[m.a.r][m.b.f]=null;b[m.b.r][m.b.f]=m.promo?c+prom:p;
 if(m.castle){const rr=m.a.r;if(m.castle==='K'){b[rr][5]=b[rr][7];b[rr][7]=null}else{b[rr][3]=b[rr][0];b[rr][0]=null}}
 return {piece:p,captured};
}
function choosePromo(m,animateMove=true){
 pendingPromo={m,animateMove};
 selected=null;
 render();
 promoBox.innerHTML='';
 const qpos=dsp(m.b);
 promoBox.style.left=(qpos.f*12.5)+'%';
 promoBox.style.top=(qpos.r*12.5)+'%';
 for(const q of ['Q','R','B','N']){
   const i=document.createElement('img');i.src=A+imgs[HUMAN+q];i.alt=q;i.title=q;
   i.onpointerdown=e=>e.stopPropagation();
   i.onclick=e=>{e.stopPropagation();promo.classList.remove('show');const pp=pendingPromo;pendingPromo=null;if(pp)commit(pp.m,q,pp.animateMove)};
   promoBox.appendChild(i)
 }
 promo.classList.add('show')
}
function cancelPromotion(){
 if(!pendingPromo)return;
 pendingPromo=null;
 promo.classList.remove('show');
 selected=null;
 render();
 setStatus('Your move.');
}
promo.addEventListener('pointerdown',e=>{
 if(!promo.classList.contains('show')||e.target.tagName==='IMG')return;
 e.preventDefault();e.stopPropagation();cancelPromotion();
});
function playSound(capture){const a=capture?captureSound:moveSound;try{a.currentTime=0;a.play().catch(()=>{})}catch(_){}}
function makeMover(piece,sq){const i=document.createElement('img');i.className='movingPiece'+(piece==='wN'?' trojanKnight':'');i.src=A+imgs[piece];i.alt='';const q=dsp(sq);i.style.left=(q.f*12.5)+'%';i.style.top=(q.r*12.5)+'%';moveLayer.appendChild(i);return i}
function animateElement(el,a,b){const da=dsp(a),db=dsp(b),dx=(db.f-da.f)*100,dy=(db.r-da.r)*100;return new Promise(resolve=>{el.style.transform='translate(0%,0%)';el.getBoundingClientRect();requestAnimationFrame(()=>requestAnimationFrame(()=>{el.style.transition=`transform ${ANIM_MS}ms cubic-bezier(.22,.61,.36,1)`;el.style.transform=`translate(${dx}%,${dy}%)`;setTimeout(resolve,ANIM_MS+20)}))})}
async function commit(m,promPiece='Q',animateMove=true){
 if(ended||animating)return;if(m.promo&&!promPiece){choosePromo(m,animateMove);return}
 // If the engine move lands while the user is holding a White piece for tactile interaction,
 // release that temporary drag first. The real position was never changed.
 if(turn===ENGINE&&pointerMode==='engine-tactile')cancelTactileDrag();
 clearAnnotations();
 animating=true;selected=null;render();
 const c=turn,piece=B[m.a.r][m.a.f];const capPiece=m.ep?B[m.a.r][m.b.f]:B[m.b.r][m.b.f];const isCapture=!!capPiece;
 if(piece[1]==='K'){castle[c+'K']=castle[c+'Q']=0}
 if(piece[1]==='R'){if(m.a.f===0)castle[c+'Q']=0;if(m.a.f===7)castle[c+'K']=0}
 if(capPiece&&capPiece[1]==='R'&&!m.ep){const oc=opp(c),home=oc==='w'?7:0;if(m.b.r===home&&m.b.f===0)castle[oc+'Q']=0;if(m.b.r===home&&m.b.f===7)castle[oc+'K']=0}
 const pawnMove=piece[1]==='P';
 // Click-to-move and engine moves animate. Human drag-and-drop moves do not:
 // once released, the piece snaps directly to the centered destination square.
 let rookAnim=null,mover=null,rookMover=null;
 if(m.castle){const rr=m.a.r,rookFrom={f:m.castle==='K'?7:0,r:rr},rookTo={f:m.castle==='K'?5:3,r:rr};rookAnim={piece:c+'R',a:rookFrom,b:rookTo}}
 if(animateMove){
   mover=makeMover(piece,m.a);
   rookMover=rookAnim?makeMover(rookAnim.piece,rookAnim.a):null;
 }

 applyBoard(B,m,c,promPiece||'Q');
 ep=m.dbl?{f:m.a.f,r:(m.a.r+m.b.r)/2}:null;
 halfmove=(pawnMove||capPiece)?0:halfmove+1;if(c==='b')fullmove++;
 lastMove={a:{...m.a},b:{...m.b}};
 playSound(isCapture);
 if(animateMove){
   const hidden=[m.b];
   if(rookAnim)hidden.push(rookAnim.b);
   render(hidden);
   const promises=[animateElement(mover,m.a,m.b)];

function updateResponsiveBoardSize(){
  const wrap=document.querySelector('.board-wrap');
  const col=document.querySelector('.game-board-column');
  const shell=document.querySelector('.game-shell');
  const board=document.querySelector('.board');
  if(!wrap||!col||!shell||!board)return;

  const vw=document.documentElement.clientWidth;
  const vh=document.documentElement.clientHeight;
  const mobile=vw<=960;
  const pagePad=vw<=640?24:40;
  const side=mobile?0:286;
  const availableWidth=Math.max(280,vw-pagePad-side);
  const top=wrap.getBoundingClientRect().top;
  const availableHeight=Math.max(280,vh-top-64);
  const size=Math.max(280,Math.floor(Math.min(availableWidth,availableHeight)*0.9));

  col.style.setProperty('max-width',size+'px','important');
  wrap.style.setProperty('width',size+'px','important');
  wrap.style.setProperty('min-width',size+'px','important');
  wrap.style.setProperty('max-width',size+'px','important');
  wrap.style.setProperty('height',size+'px','important');

  board.style.setProperty('height',size+'px','important');
  board.style.setProperty('min-width',size+'px','important');
  board.style.setProperty('max-width',size+'px','important');

}
